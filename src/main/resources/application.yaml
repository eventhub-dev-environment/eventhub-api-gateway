server:
  port: 8000

spring:
  application:
    name: api-gateway
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8082
              predicates:
                - Path=/api/v1/auth/**

            - id: config-service
              uri: http://config-service:8081
              predicates:
                - Path=/api/v1/configs/**

            - id: event-service-events
              uri: http://event-service:8083
              predicates:
                - Path=/api/v1/events/**

            - id: event-service-categories
              uri: http://event-service:8083
              predicates:
                - Path=/api/v1/categories/**

            - id: booking-service
              uri: http://booking-service:8084
              predicates:
                - Path=/api/v1/bookings/**

            - id: payment-service
              uri: http://payment-service:8085
              predicates:
                - Path=/api/v1/payments/**

            - id: notification-service
              uri: http://notification-service:8086
              predicates:
                - Path=/api/v1/notifications/**

jwt:
  secret: ${JWT_SECRET}

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: "b3,w3c"
    export:
      zipkin:
        endpoint: ${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"