spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8082
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - AddRequestHeader=X-Gateway-Secret,${GATEWAY_INTERNAL_SECRET:EventHubSecretKey2026!}

            - id: config-service
              uri: http://config-service:8081
              predicates:
                - Path=/api/v1/configs/**
              filters:
                - AddRequestHeader=X-Gateway-Secret,${GATEWAY_INTERNAL_SECRET:EventHubSecretKey2026!}